name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.1
  HADOLINT_IMAGE: docker.io/hadolint/hadolint:v2.15.1-alpine
  IMAGE: guess-the-country:ci

jobs:
  # ---------------------------------------------------------------- frontend
  frontend-lint:
    name: Frontend lint, type check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: Build static export
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  dependency-audit:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (all deps, fail on high+)
        run: npm audit --audit-level=high
      - name: npm audit signatures (registry provenance)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm audit signatures

  # ---------------------------------------------------------------- backend
  backend-scan:
    name: Backend C build and static analysis
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and analyzers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc make libsqlite3-dev cppcheck clang-tidy flawfinder
      - name: Hardened build (-Werror)
        run: make server
      - name: gcc -fanalyzer
        run: make analyze
      - name: cppcheck
        run: make cppcheck
      - name: clang-tidy (clang static analyzer, bugprone, cert)
        run: make tidy
      - name: flawfinder (CWE scan)
        run: make flawfinder

  backend-sanitizers:
    name: Backend ASan/UBSan + API smoke test
    runs-on: ubuntu-24.04
    needs: frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc make libsqlite3-dev
      - name: Build with sanitizers
        working-directory: backend
        run: make sanitize
      - name: Run server and smoke test
        working-directory: backend
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: |
          # Server paths are fixed: ./public (static export), ./data/game.db
          ln -sfn ../frontend/dist public
          ./server-asan > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          sh ../tests/smoke.sh
          kill -TERM "$pid"
          wait "$pid" || true
          if grep -E "AddressSanitizer|LeakSanitizer|runtime error" "$RUNNER_TEMP/server.log"; then
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - backend/vendor
              - frontend/node_modules
      - name: Build C backend
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc make libsqlite3-dev
          make -C backend server
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------- docker
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w "$HADOLINT_IMAGE" \
            hadolint --config .hadolint.yaml Dockerfile

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs (vulns, secrets, misconfig)
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --include-dev-deps \
            --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs /repo/frontend/node_modules \
            /repo

  container:
    name: Container build, smoke test, Trivy image scan
    runs-on: ubuntu-24.04
    needs: [hadolint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Smoke test container (API + Svelte static export)
        run: |
          docker run -d --name app -p 8000:8000 "$IMAGE"
          BASE_URL=http://localhost:8000 sh tests/smoke.sh
          test "$(docker exec app id -u)" != "0" || { echo "container runs as root"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs app || true
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE"
